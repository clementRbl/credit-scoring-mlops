name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6

      # Les tests couvrent aussi le pipeline de réentraînement (MLflow, DVC).
      - name: Installer les dépendances
        run: uv pip install --system -r requirements-pipeline.txt

      - name: Lancer les tests
        run: pytest tests/ -v --cov=app --cov=pipeline --cov-report=term-missing

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Construire l'image Docker
        run: docker build -t credit-scoring-api .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Déployer sur Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git lfs install
          git filter-branch --force --index-filter 'git rm --cached --ignore-unmatch model/model.onnx' --prune-empty -- --all
          git lfs migrate import --include="*.parquet,*.pkl,*.png" --everything
          git remote add hf https://ClementRbl:$HF_TOKEN@huggingface.co/spaces/ClementRbl/credit-scoring-api || true
          git push hf main --force

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6

      # Le modèle déployé devient le champion du Model Registry : la surveillance
      # et le prochain réentraînement le compareront à ce modèle-là.
      - name: Donner l'alias champion au modèle déployé
        env:
          DAGSHUB_USER: ${{ vars.DAGSHUB_USER }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          uv pip install --system -r requirements-pipeline.txt
          python -m pipeline.registry
